# Low-footprint local-development profile.
# Loaded via include_dir '/etc/postgresql-custom/conf.d'; every value here is
# overridable by the CLI with `postgres -c` flags or a later include.

# RAM: local stacks lean on the OS page cache; 25 parallel stacks make every
# megabyte of shared_buffers count. wal_level stays 'logical' (realtime needs it).
shared_buffers = 32MB
effective_cache_size = 128MB
maintenance_work_mem = 32MB
max_connections = 50
max_wal_size = 128MB
jit = off

# CPU: stretch idle-tick work so a quiet database stays quiet.
autovacuum_naptime = 60s
bgwriter_delay = 2000ms
wal_writer_delay = 2000ms
checkpoint_completion_target = 0.9
