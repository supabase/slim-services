# ---------------------------------------------------------------------------
# slim-services: local-dev divergences from the docker.io image configuration.
#
# Everything ABOVE this block in postgresql.conf is the docker.io recipe
# verbatim (ansible/files/postgresql_config/postgresql.conf.j2 with the same
# edits Dockerfile-supabase applies, plus mechanical include-path relocation).
# Every line BELOW is a deliberate, documented difference. Keep this list
# minimal: it is the complete answer to "how does slim differ from docker.io".
# ---------------------------------------------------------------------------

# Native CLI contract: a loopback dev server on the CLI port. The Docker
# image's entry.sh overrides these two to 5432/'*' at first boot.
listen_addresses = '127.0.0.1'
port = 54322

# Neither the distroless image nor a host runtime has /var/run/postgresql
# (docker.io seds the socket dir to it); the bundle's migrate step and the
# CLI native runtime both expect the /tmp socket.
unix_socket_directories = '/tmp'

# Low-footprint local-dev profile: local stacks lean on the OS page cache;
# 25 parallel stacks make every megabyte of shared_buffers count.
shared_buffers = 32MB
effective_cache_size = 128MB
maintenance_work_mem = 32MB
max_connections = 50
max_wal_size = 128MB
jit = off

# CPU: stretch idle-tick work so a quiet database stays quiet.
autovacuum_naptime = 60s
bgwriter_delay = 2000ms
wal_writer_delay = 2000ms
checkpoint_completion_target = 0.9
