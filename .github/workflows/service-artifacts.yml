name: Service artifacts

# Builds, smokes, and uploads per-service host-native archives for every
# supported CI target (CI_MATRIX.md, HOST_NATIVE_PLAN.md native-first):
#
#   linux-arm64 / linux-amd64  — native runners build the portable artifact
#                                (Nix or build-host.sh), derive the Docker
#                                image from it, smoke the image, smoke the
#                                artifact as a real host process
#                                (SLIM_DIRECT_LINUX_ARTIFACT_SMOKE=1), and
#                                archive + SHA256SUMS.
#   darwin-arm64               — host-native contract: Nix/host builds,
#                                portable audit, host-process smoke with a
#                                Docker-free harness postgres (macOS runners
#                                have no Docker).
#
# darwin-amd64 is intentionally absent: GitHub-hosted Intel macOS runners are
# retired from the free tier (macos-14+ are arm64-only; Intel exists only as
# paid `-large` runners), and CI_MATRIX.md keeps that target out of scope.
"on":
  workflow_dispatch:
    inputs:
      services:
        description: Space-separated services to build (default = all promoted).
        required: false
        default: auth postgrest realtime pooler analytics storage edge-runtime pgmeta postgres
      targets:
        description: Space-separated targets (linux-arm64 linux-amd64 darwin-arm64).
        required: false
        default: linux-arm64 linux-amd64 darwin-arm64
      force:
        description: Rebuild even when an identical artifact is already cached.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: expand build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
    steps:
      - name: Expand services x targets
        id: expand
        shell: bash
        env:
          SERVICES: ${{ inputs.services }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          matrix_json="$(python3 - <<'PY'
          import json
          import os

          # The repo is internal, so GitHub's free ubuntu-*-arm label (public
          # repos only) is unavailable; the org's large runners provide arm64
          # Linux.
          runners = {
              "linux-arm64": "large-linux-arm",
              "linux-amd64": "large-linux-x86",
              "darwin-arm64": "macos-14",
          }

          include = []
          for service in os.environ["SERVICES"].split():
              for target in os.environ["TARGETS"].split():
                  if target not in runners:
                      raise SystemExit(f"unsupported target: {target}")
                  target_os, arch = target.split("-", 1)
                  include.append({
                      "service": service,
                      "target_os": target_os,
                      "arch": arch,
                      "platform_dir": target,
                      "runner": runners[target],
                  })
          print(json.dumps({"include": include}))
          PY
          )"
          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.service }} ${{ matrix.target_os }}/${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare target variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          version="$(TARGET_OS="${{ matrix.target_os }}" ARCH="${{ matrix.arch }}" bash -c '
            source scripts/lib.sh
            load_recipe "${{ matrix.service }}" >/dev/null 2>&1
            printf "%s" "$SOURCE_REF"
          ')"
          artifact_dir="artifacts/${{ matrix.service }}/${version}/${{ matrix.platform_dir }}"
          # Content fingerprint of everything that determines this artifact:
          # the service dir (recipe, overlay, Dockerfile.slim, smoke, nix
          # overlay, build-host), the source submodule pin, the shared
          # scripts/, and this workflow. Same fingerprint => identical
          # artifact => the build/smoke below can be skipped and the cached
          # archive re-uploaded.
          fingerprint="$(
            {
              git rev-parse "HEAD:services/${{ matrix.service }}"
              git ls-tree HEAD "sources/${{ matrix.service }}"
              git rev-parse "HEAD:scripts"
              git rev-parse "HEAD:.github/workflows/service-artifacts.yml"
            } | shasum -a 256 | cut -d' ' -f1
          )"
          {
            printf 'version=%s\n' "$version"
            printf 'artifact_dir=%s\n' "$artifact_dir"
            printf 'fingerprint=%s\n' "$fingerprint"
          } >> "$GITHUB_OUTPUT"

      # Content-addressed skip: if this exact (service, target, fingerprint)
      # was already built and smoked on any previous run, restore the
      # finished archive + manifest instead of rebuilding. `force: true`
      # bypasses the lookup and rebuilds (GitHub cache entries are
      # immutable, so the rebuild cannot replace an existing entry — bump
      # the artifact-v1 prefix if a cached artifact must be invalidated by
      # hand).
      - name: Restore identical artifact from cache
        id: artifact-cache
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: artifact-v1-${{ matrix.service }}-${{ matrix.platform_dir }}-${{ steps.vars.outputs.fingerprint }}
          path: |
            ${{ steps.vars.outputs.artifact_dir }}/*.tar.zst
            ${{ steps.vars.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.vars.outputs.artifact_dir }}/manifest.json

      - name: Report skip
        if: steps.artifact-cache.outputs.cache-hit == 'true'
        run: echo "identical artifact already built (fingerprint ${{ steps.vars.outputs.fingerprint }}); skipping build and smoke, re-uploading the cached archive"

      - name: Checkout service source
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 "sources/${{ matrix.service }}"

      # Nix drives every native build (BEAM packages, Node/libpq pins, and
      # the Docker-free harness postgres on macOS).
      - name: Install Nix
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Restore/save Nix store cache
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-host-native-${{ matrix.service }}-${{ matrix.platform_dir }}-${{ hashFiles(format('services/{0}/recipe.env', matrix.service), format('services/{0}/nix/**', matrix.service), format('services/{0}/build-host.sh', matrix.service), 'scripts/nix-build-with-derived-mix-hash.sh', 'scripts/nixpkgs-pin.sh') }}
          restore-prefixes-first-match: |
            nix-host-native-${{ matrix.service }}-${{ matrix.platform_dir }}-
          gc-max-store-size-linux: 8G
          gc-max-store-size-macos: 8G

      - name: Set up Docker Buildx
        if: matrix.target_os == 'linux' && steps.artifact-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Go
        if: matrix.service == 'auth' && steps.artifact-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build, audit, smoke, and package
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          ARCH: ${{ matrix.arch }}
          # macOS runners have no Docker; run the harness postgres as a host
          # process from the pinned nixpkgs. No effect on linux runners.
          SLIM_SMOKE_HOST_POSTGRES: ${{ matrix.target_os == 'darwin' && '1' || '0' }}
        run: |
          set -euo pipefail
          scripts/ci-build-service.sh "${{ matrix.service }}" "${{ steps.vars.outputs.version }}"

      # The image smoke above covers the Docker flavor; this covers the CLI's
      # no-Docker mode with the same artifact running as a host process.
      - name: Smoke artifact as a host process (linux)
        if: matrix.target_os == 'linux' && steps.artifact-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SLIM_DIRECT_LINUX_ARTIFACT_SMOKE: "1"
        run: |
          set -euo pipefail
          scripts/smoke.sh "${{ matrix.service }}" --artifact "${{ steps.vars.outputs.artifact_dir }}/rootfs"

      - name: Save artifact to cache
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: artifact-v1-${{ matrix.service }}-${{ matrix.platform_dir }}-${{ steps.vars.outputs.fingerprint }}
          path: |
            ${{ steps.vars.outputs.artifact_dir }}/*.tar.zst
            ${{ steps.vars.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.vars.outputs.artifact_dir }}/manifest.json

      - name: Upload archive + checksums + manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.service }}-${{ steps.vars.outputs.version }}-${{ matrix.platform_dir }}
          if-no-files-found: error
          path: |
            ${{ steps.vars.outputs.artifact_dir }}/*.tar.zst
            ${{ steps.vars.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.vars.outputs.artifact_dir }}/manifest.json

  # Refresh the README/report results tables from the manifests this run
  # produced and open a docs PR when the numbers changed. --merge only
  # touches rows for services that were rebuilt (whatever succeeded, even on
  # a partial or partially-failed run) and keeps every other row verbatim.
  update-tables:
    name: refresh results tables
    needs: build
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download run manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ci-artifacts

      - name: Place manifests into the artifacts layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import shutil

          placed = 0
          for path in glob.glob("ci-artifacts/*/manifest.json"):
              with open(path, encoding="utf-8") as fh:
                  m = json.load(fh)
              service = m.get("service")
              version = m.get("version")
              platform_dir = (m.get("platform") or "").replace("/", "-")
              if not (service and version and platform_dir):
                  print(f"skipping {path}: missing service/version/platform")
                  continue
              dest = os.path.join("artifacts", service, version, platform_dir)
              os.makedirs(dest, exist_ok=True)
              shutil.copy(path, os.path.join(dest, "manifest.json"))
              placed += 1
              print(f"placed {service} {version} {platform_dir}")
          print(f"{placed} manifests placed")
          PY

      - name: Regenerate tables (merge mode)
        shell: bash
        run: |
          set -euo pipefail
          scripts/update-results-tables.sh --merge

      - name: Open a docs PR when the tables changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet README.md SLIM_IMAGES_REPORT.md; then
            echo "tables unchanged; nothing to do"
            exit 0
          fi
          branch="ci/results-tables-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md SLIM_IMAGES_REPORT.md
          git commit -m "Docs: refresh results tables from CI run ${{ github.run_id }}"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Docs: refresh results tables (CI run ${{ github.run_id }})" \
            --body "Automated table refresh from the [service-artifacts run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Rows for services rebuilt in that run were regenerated from their manifests; all other rows were kept verbatim; totals recomputed from the final row set."
