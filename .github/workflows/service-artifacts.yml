name: Service artifacts

# Builds, smokes, and uploads per-service host-native archives for every
# supported CI target (CI_MATRIX.md, HOST_NATIVE_ARTIFACTS.md native-first):
#
#   linux-arm64 / linux-amd64  — native runners build the portable artifact
#                                (Nix or build-host.sh), derive the Docker
#                                image from it, smoke the image, smoke the
#                                artifact as a real host process
#                                (SLIM_DIRECT_LINUX_ARTIFACT_SMOKE=1), and
#                                archive + SHA256SUMS.
#   darwin-arm64               — host-native contract: Nix/host builds,
#                                portable audit, host-process smoke with a
#                                Docker-free harness postgres (macOS runners
#                                have no Docker).
#
# darwin-amd64 is intentionally absent: GitHub-hosted Intel macOS runners are
# retired from the free tier (macos-14+ are arm64-only; Intel exists only as
# paid `-large` runners), and CI_MATRIX.md keeps that target out of scope.
"on":
  workflow_dispatch:
    inputs:
      services:
        description: Space-separated services to build (default = all promoted).
        required: false
        default: auth postgrest realtime pooler analytics storage edge-runtime studio pgmeta postgres
      external_versions:
        description: JSON object mapping explicitly selected external services to versions.
        required: false
        default: '{}'
      targets:
        description: Space-separated targets (linux-arm64 linux-amd64 darwin-arm64).
        required: false
        default: linux-arm64 linux-amd64 darwin-arm64
      force:
        description: Rebuild even when an identical artifact is already cached.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: expand build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
      external: ${{ steps.expand.outputs.external }}
      external_snapshot_artifact: ${{ steps.expand.outputs.external_snapshot_artifact }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read external release requirements
        id: external
        shell: bash
        env:
          SERVICES: ${{ inputs.services }}
          EXTERNAL_VERSIONS: ${{ inputs.external_versions }}
        run: |
          set -euo pipefail
          python3 - "$SERVICES" "$EXTERNAL_VERSIONS" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import sys

          services = sys.argv[1].split()
          with open(".github/service-release-sources.json", encoding="utf-8") as stream:
              registry = json.load(stream)["services"]
          external = [service for service in services if registry.get(service, {}).get("external_release_descriptor")]
          source_tag = False
          for service in external:
              descriptor = pathlib.Path(registry[service]["external_release_descriptor"])
              with descriptor.open(encoding="utf-8") as stream:
                  source_tag = source_tag or json.load(stream)["github"]["artifact"]["type"] == "source-tag"
          print(f"external={'true' if external else 'false'}")
          print(f"source_tag={'true' if source_tag else 'false'}")
          PY

      - name: Install pinned regctl for external artifact planning
        if: steps.external.outputs.external == 'true'
        shell: bash
        run: |
          set -euo pipefail
          regctl_version="v0.11.5"
          expected_sha256="c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467"
          curl -fsSL \
            "https://github.com/regclient/regclient/releases/download/${regctl_version}/regctl-linux-amd64" \
            -o "$RUNNER_TEMP/regctl"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/regctl" | cut -d' ' -f1)"
          [[ "$actual_sha256" == "$expected_sha256" ]] || {
            printf 'regctl checksum mismatch: expected %s, got %s\n' "$expected_sha256" "$actual_sha256" >&2
            exit 1
          }
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Nix for external source-tag planning
        if: steps.external.outputs.source_tag == 'true'
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Expand services x targets
        id: expand
        shell: bash
        env:
          SERVICES: ${{ inputs.services }}
          TARGETS: ${{ inputs.targets }}
          EXTERNAL_VERSIONS: ${{ inputs.external_versions }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          snapshot_dir="$RUNNER_TEMP/external-release"
          mkdir -p "$snapshot_dir"
          external_json="$(scripts/validate-external-versions.sh "$SERVICES" "$EXTERNAL_VERSIONS")"
          matrix_file="$RUNNER_TEMP/service-artifacts-matrix.json"
          EXTERNAL_MAP="$external_json" python3 - >"$matrix_file" <<'PY'
          import json
          import os

          # Use the org's large runners for consistent Linux capacity across
          # repository visibility changes.
          runners = {
              "linux-arm64": "large-linux-arm",
              "linux-amd64": "large-linux-x86",
              "darwin-arm64": "macos-14-xlarge",
          }

          external_versions = json.loads(os.environ["EXTERNAL_MAP"])

          selected = os.environ["SERVICES"].split()
          external = external_versions

          include = []
          for service in selected:
              for target in os.environ["TARGETS"].split():
                  if target not in runners:
                      raise SystemExit(f"unsupported target: {target}")
                  target_os, arch = target.split("-", 1)
                  item = {
                      "service": service,
                      "target_os": target_os,
                      "arch": arch,
                      "platform_dir": target,
                      "runner": runners[target],
                  }
                  if service in external:
                      item["version"] = external[service]
                      item["external"] = True
                  include.append(item)
          print(json.dumps({"include": include}))
          PY
          matrix_json="$(cat "$matrix_file")"
          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"
          external_flag=false
          [[ "$external_json" != '{}' ]] && external_flag=true
          printf 'external=%s\n' "$external_flag" >> "$GITHUB_OUTPUT"
          printf 'external_snapshot_artifact=external-release-artifacts-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          external_list="$RUNNER_TEMP/external-release-list.tsv"
          python3 - "$external_json" >"$external_list" <<'PY'
          import json
          import sys
          for service, version in sorted(json.loads(sys.argv[1]).items()):
              print(service, version, sep="\t")
          PY
          while IFS=$'\t' read -r service version; do
            [[ -n "$service" ]] || continue
            scripts/plan-external-release.sh "$service" "$version" "$snapshot_dir/$service.json" >/dev/null
          done <"$external_list"

      - name: Upload planned external release snapshots
        if: steps.expand.outputs.external == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-release-artifacts-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/external-release/

  build:
    name: ${{ matrix.service }} ${{ matrix.target_os }}/${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download planned external release snapshots
        if: needs.plan.outputs.external == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.external_snapshot_artifact }}
          path: external-release

      - name: Verify and export selected external release snapshot
        if: needs.plan.outputs.external == 'true' && matrix.external == true
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          snapshot="$GITHUB_WORKSPACE/external-release/$SERVICE.json"
          scripts/verify-external-release.sh "$snapshot" "$VERSION"
          printf 'UPSTREAM_ASSETS_FILE=%s\n' "$snapshot" >> "$GITHUB_ENV"

      - name: Prepare target variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          recipe_metadata="$(TARGET_OS="${{ matrix.target_os }}" ARCH="${{ matrix.arch }}" SERVICE="${{ matrix.service }}" bash -c '
            source scripts/lib.sh
            load_recipe "$SERVICE" >/dev/null 2>&1
            printf "%s|%s|%s" "${ARTIFACT_BACKEND:?recipe must define ARTIFACT_BACKEND}" "${SOURCE_REF:-}" "${UPSTREAM_ASSETS_FILE:-}"
          ')"
          IFS='|' read -r artifact_backend source_ref upstream_assets_file <<< "$recipe_metadata"
          if [[ "${{ matrix.external || false }}" == "true" ]]; then
            version="${{ matrix.version }}"
            [[ -n "$version" ]] || {
              printf 'external matrix entry has no version: %s\n' "${{ matrix.service }}" >&2
              exit 1
            }
          elif [[ "$artifact_backend" == "upstream-archive" ]]; then
            policy_file="$upstream_assets_file"
            [[ "$policy_file" = /* ]] || policy_file="${GITHUB_WORKSPACE:-$PWD}/$policy_file"
          version="$(python3 - "$policy_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              versions = json.load(stream)["versions"]
          if len(versions) != 1:
              raise SystemExit(
                  "upstream-archive standalone builds require exactly one configured version"
              )
          print(next(iter(versions)))
          PY
            )"
          else
            [[ -n "$source_ref" ]] || {
              printf 'source-backed service has no SOURCE_REF: %s\n' "${{ matrix.service }}" >&2
              exit 1
            }
            version="$source_ref"
          fi
          artifact_dir="artifacts/${{ matrix.service }}/${version}/${{ matrix.platform_dir }}"
          # Content fingerprint of everything that determines this artifact:
          # the service dir (recipe, overlay, Dockerfile.slim, smoke, nix
          # overlay, build-host), the source submodule pin, the shared
          # scripts/, and this workflow. Same fingerprint => identical
          # artifact => the build/smoke below can be skipped and the cached
          # archive re-uploaded.
          fingerprint="$({
            git rev-parse "HEAD:services/${{ matrix.service }}"
            if [[ "${{ matrix.external || false }}" == "true" ]]; then
              git rev-parse "HEAD:services/${{ matrix.service }}/external-release.json"
              cat "$upstream_assets_file.sha256"
            elif [[ "$artifact_backend" == "upstream-archive" ]]; then
              git rev-parse "HEAD:services/${{ matrix.service }}/upstream-assets.json"
            else
              git ls-tree HEAD "sources/${{ matrix.service }}"
            fi
            git rev-parse "HEAD:scripts"
            git rev-parse "HEAD:.github/workflows/service-artifacts.yml"
          } | shasum -a 256 | cut -d' ' -f1
          )"
          {
            printf 'artifact_backend=%s\n' "$artifact_backend"
            printf 'version=%s\n' "$version"
            printf 'artifact_dir=%s\n' "$artifact_dir"
            printf 'fingerprint=%s\n' "$fingerprint"
          } >> "$GITHUB_OUTPUT"

      # Content-addressed skip: if this exact (service, target, fingerprint)
      # was already built and smoked on any previous run, restore the
      # finished archive + manifest instead of rebuilding. `force: true`
      # bypasses the lookup and rebuilds (GitHub cache entries are
      # immutable, so the rebuild cannot replace an existing entry — bump
      # the artifact-v1 prefix if a cached artifact must be invalidated by
      # hand).
      - name: Restore identical artifact from cache
        id: artifact-cache
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: artifact-v1-${{ matrix.service }}-${{ matrix.platform_dir }}-${{ steps.vars.outputs.fingerprint }}
          path: |
            ${{ steps.vars.outputs.artifact_dir }}/*.tar.zst
            ${{ steps.vars.outputs.artifact_dir }}/*.sbom.spdx.json
            ${{ steps.vars.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.vars.outputs.artifact_dir }}/manifest.json

      - name: Report skip
        if: steps.artifact-cache.outputs.cache-hit == 'true'
        run: echo "identical artifact already built (fingerprint ${{ steps.vars.outputs.fingerprint }}); skipping build and smoke, re-uploading the cached archive"

      - name: Checkout service source
        if: steps.artifact-cache.outputs.cache-hit != 'true' && steps.vars.outputs.artifact_backend != 'upstream-archive' && matrix.external != true
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 "sources/${{ matrix.service }}"

      # Nix drives every native build (BEAM packages, Node/libpq pins, and
      # the Docker-free harness postgres on macOS).
      - name: Install Nix
        if: steps.artifact-cache.outputs.cache-hit != 'true' && steps.vars.outputs.artifact_backend != 'upstream-archive'
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Restore/save Nix store cache
        if: steps.artifact-cache.outputs.cache-hit != 'true' && steps.vars.outputs.artifact_backend != 'upstream-archive'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-host-native-${{ matrix.service }}-${{ matrix.platform_dir }}-${{ hashFiles(format('services/{0}/recipe.env', matrix.service), format('services/{0}/nix/**', matrix.service), format('services/{0}/build-host.sh', matrix.service), 'scripts/nix-build-with-derived-mix-hash.sh', 'scripts/nixpkgs-pin.sh') }}
          restore-prefixes-first-match: |
            nix-host-native-${{ matrix.service }}-${{ matrix.platform_dir }}-
          gc-max-store-size-linux: 8G
          gc-max-store-size-macos: 8G

      - name: Set up Docker Buildx
        if: matrix.target_os == 'linux' && steps.artifact-cache.outputs.cache-hit != 'true' && steps.vars.outputs.artifact_backend != 'upstream-archive' && matrix.external != true
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Go
        if: matrix.service == 'auth' && steps.artifact-cache.outputs.cache-hit != 'true' && steps.vars.outputs.artifact_backend != 'upstream-archive'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sources/auth/go.mod
          cache-dependency-path: sources/auth/go.sum

      - name: Build, audit, smoke, and package
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          ARCH: ${{ matrix.arch }}
          # macOS runners have no Docker; run the harness postgres as a host
          # process from the pinned nixpkgs. No effect on linux runners.
          SLIM_SMOKE_HOST_POSTGRES: ${{ matrix.target_os == 'darwin' && '1' || '0' }}
        run: |
          set -euo pipefail
          scripts/ci-build-service.sh "${{ matrix.service }}" "${{ steps.vars.outputs.version }}"

      # The image smoke above covers the Docker flavor; this covers the CLI's
      # no-Docker mode with the same artifact running as a host process.
      - name: Smoke artifact as a host process (linux)
        if: matrix.target_os == 'linux' && steps.artifact-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SLIM_DIRECT_LINUX_ARTIFACT_SMOKE: "1"
        run: |
          set -euo pipefail
          scripts/smoke.sh "${{ matrix.service }}" --artifact "${{ steps.vars.outputs.artifact_dir }}/rootfs"

      - name: Save artifact to cache
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: artifact-v1-${{ matrix.service }}-${{ matrix.platform_dir }}-${{ steps.vars.outputs.fingerprint }}
          path: |
            ${{ steps.vars.outputs.artifact_dir }}/*.tar.zst
            ${{ steps.vars.outputs.artifact_dir }}/*.sbom.spdx.json
            ${{ steps.vars.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.vars.outputs.artifact_dir }}/manifest.json

      - name: Upload archive + checksums + manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.service }}-${{ steps.vars.outputs.version }}-${{ matrix.platform_dir }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.vars.outputs.artifact_dir }}/*.tar.zst
            ${{ steps.vars.outputs.artifact_dir }}/*.sbom.spdx.json
            ${{ steps.vars.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.vars.outputs.artifact_dir }}/manifest.json

  # Refresh the README/report results tables from the manifests this run
  # produced and open a docs PR when the numbers changed. --merge only
  # touches rows for services that were rebuilt (whatever succeeded, even on
  # a partial or partially-failed run) and keeps every other row verbatim.
  update-tables:
    name: refresh results tables
    needs: build
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download run manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ci-artifacts

      - name: Place manifests into the artifacts layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import shutil

          placed = 0
          for path in glob.glob("ci-artifacts/*/manifest.json"):
              with open(path, encoding="utf-8") as fh:
                  m = json.load(fh)
              service = m.get("service")
              version = m.get("version")
              platform_dir = (m.get("platform") or "").replace("/", "-")
              if not (service and version and platform_dir):
                  print(f"skipping {path}: missing service/version/platform")
                  continue
              dest = os.path.join("artifacts", service, version, platform_dir)
              os.makedirs(dest, exist_ok=True)
              shutil.copy(path, os.path.join(dest, "manifest.json"))
              placed += 1
              print(f"placed {service} {version} {platform_dir}")
          print(f"{placed} manifests placed")
          PY

      - name: Regenerate tables (merge mode)
        shell: bash
        run: |
          set -euo pipefail
          scripts/update-results-tables.sh --merge

      - name: Open a docs PR when the tables changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet README.md SLIM_IMAGES_REPORT.md; then
            echo "tables unchanged; nothing to do"
            exit 0
          fi
          branch="ci/results-tables-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md SLIM_IMAGES_REPORT.md
          git commit -m "Docs: refresh results tables from CI run ${{ github.run_id }}"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Docs: refresh results tables (CI run ${{ github.run_id }})" \
            --body "Automated table refresh from the [service-artifacts run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Rows for services rebuilt in that run were regenerated from their manifests; all other rows were kept verbatim; totals recomputed from the final row set."
