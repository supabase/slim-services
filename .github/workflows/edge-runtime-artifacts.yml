name: Edge Runtime artifacts

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Edge Runtime version/ref to build.
        required: true
        default: v1.73.15

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/edge-runtime

jobs:
  build:
    name: edge-runtime ${{ matrix.target_os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            arch: arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
            docker_platform: linux/arm64
            docker_image: true
          - target_os: linux
            arch: amd64
            runner: blacksmith-8vcpu-ubuntu-2404
            docker_platform: linux/amd64
            docker_image: true
          - target_os: darwin
            arch: arm64
            runner: macos-14
            docker_platform: ""
            docker_image: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Edge Runtime source
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          git submodule update --init --depth 1 sources/edge-runtime
          git -C sources/edge-runtime fetch --force --depth 1 origin "refs/tags/${version}:refs/tags/${version}" || \
            git -C sources/edge-runtime fetch --force --depth 1 origin "$version"
          git -C sources/edge-runtime checkout --detach "$version" 2>/dev/null || \
            git -C sources/edge-runtime checkout --detach FETCH_HEAD

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Restore/save Nix store cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.target_os }}-${{ matrix.arch }}-${{ hashFiles('sources/edge-runtime/flake.lock', 'services/edge-runtime/nix/**/*.nix', 'services/edge-runtime/recipe.env') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ matrix.target_os }}-${{ matrix.arch }}-
          gc-max-store-size-linux: 8G
          gc-max-store-size-macos: 8G

      - name: Set up Docker Buildx
        if: matrix.docker_image
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: matrix.docker_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare target variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          platform_dir="${{ matrix.target_os }}-${{ matrix.arch }}"
          artifact_dir="artifacts/edge-runtime/${version}/${platform_dir}"
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          {
            printf 'version=%s\n' "$version"
            printf 'platform_dir=%s\n' "$platform_dir"
            printf 'artifact_dir=%s\n' "$artifact_dir"
            printf 'archive_prefix=%s\n' "${artifact_dir}/edge-runtime-${version}-${platform_dir}"
            printf 'local_image_tag=%s\n' "local/edge-runtime:${version}-${platform_dir}"
            printf 'image_repository=%s\n' "$image_repository"
          } >> "$GITHUB_OUTPUT"

      - name: Build, smoke, and package
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          ARCH: ${{ matrix.arch }}
          IMAGE_TAG: ${{ steps.vars.outputs.local_image_tag }}
          ARTIFACT_ARCHIVE_PREFIX: ${{ steps.vars.outputs.archive_prefix }}
          SOURCE_REF: ${{ steps.vars.outputs.version }}
          GIT_V_TAG: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          scripts/ci-build-service.sh edge-runtime "${{ steps.vars.outputs.version }}"

      - name: Push platform image by digest
        if: matrix.docker_image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="$(mktemp)"

          docker buildx build \
            --platform "${{ matrix.docker_platform }}" \
            -f services/edge-runtime/Dockerfile.slim \
            --build-arg "ARTIFACT_ROOT=${{ steps.vars.outputs.artifact_dir }}/rootfs" \
            --build-arg "BASE_IMAGE=gcr.io/distroless/base-debian13:nonroot" \
            --output "type=image,name=${{ steps.vars.outputs.image_repository }},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$metadata_file" \
            .

          digest="$(python3 -c 'import json, sys; data = json.load(open(sys.argv[1])); descriptor = data.get("containerimage.descriptor") or {}; digest = data.get("containerimage.digest") or descriptor.get("digest"); print(digest) if digest else (_ for _ in ()).throw(SystemExit(f"could not find image digest in {data}"))' "$metadata_file")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write platform digest
        if: matrix.docker_image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.vars.outputs.artifact_dir }}"
          python3 -c 'import json, sys; json.dump({"platform": sys.argv[1], "repository": sys.argv[2], "digest": sys.argv[3]}, open(sys.argv[4], "w"), indent=2)' \
            "${{ matrix.docker_platform }}" \
            "${{ steps.vars.outputs.image_repository }}" \
            "${{ steps.push.outputs.digest }}" \
            "${{ steps.vars.outputs.artifact_dir }}/image-digest.json"

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: edge-runtime-${{ steps.vars.outputs.platform_dir }}
          if-no-files-found: error
          path: ${{ steps.vars.outputs.archive_prefix }}.tar.zst

      - name: Upload platform image digest
        if: matrix.docker_image
        uses: actions/upload-artifact@v4
        with:
          name: edge-runtime-image-digest-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ steps.vars.outputs.artifact_dir }}/image-digest.json

  publish-image:
    name: publish edge-runtime multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: edge-runtime-image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tag
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_tag="${image_repository}:${{ inputs.version }}"

          mapfile -t refs < <(python3 -c 'import glob, json; [print(d["repository"] + "@" + d["digest"]) for d in [json.load(open(path)) for path in sorted(glob.glob("image-digests/*.json"))]]')

          if [[ "${#refs[@]}" -ne 2 ]]; then
            printf 'expected 2 platform image digests, got %s\n' "${#refs[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create -t "$image_tag" "${refs[@]}"
          docker buildx imagetools inspect "$image_tag"
