name: Bot PR auto-merge

"on":
  # Only this event lets the job use the auto-approve environment's secret.
  # The job never checks out or runs code from the pull request.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions: {}

jobs:
  approve-and-merge:
    name: approve and enable auto-merge
    # Two bot PRs merge unattended: the release-results refresh and Dependabot
    # GitHub Actions bumps. The user and sender checks keep a person pushing to
    # either branch from getting approved. CODEOWNERS limits `supabase-oss` to
    # README.md and .github/workflows/, so its approval covers no other file.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (
        (
          github.event.pull_request.user.login == 'supabase-cli-releaser[bot]' &&
          github.event.sender.login == 'supabase-cli-releaser[bot]' &&
          github.event.pull_request.head.ref == 'gha/refresh-release-results'
        ) || (
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.sender.login == 'dependabot[bot]' &&
          startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Holds `AUTO_APPROVE_PR_PAT` (supabase-oss); the environment only deploys
    # from the default branch.
    environment: auto-approve
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Pushes do not dismiss approvals; skipping an approved PR avoids
      # stacking a review per refresh.
      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.AUTO_APPROVE_PR_PAT }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          decision="$(GH_TOKEN="$APP_TOKEN" gh pr view --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)"
          if [ "$decision" != "APPROVED" ]; then
            gh pr review --approve --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
          fi

      # The merge queue runs the required repository checks before merging.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
