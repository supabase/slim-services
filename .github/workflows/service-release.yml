name: Release service artifacts and image
run-name: Release ${{ inputs.service }} ${{ inputs.version }}

"on":
  workflow_dispatch:
    inputs:
      service:
        description: Service to release.
        required: true
        type: choice
        options:
          - auth
          - postgrest
          - realtime
          - pooler
          - analytics
          - storage
          - edge-runtime
          - studio
          - pgmeta
          - postgres
          - mailpit
          - vector
          - imgproxy
      version:
        description: Published stable upstream release or image tag.
        required: true
        type: string
      force:
        description: Rebuild and replace assets when the release already exists.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      version:
        required: true
        type: string
      force:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: service-release-${{ inputs.service }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan ${{ inputs.service }} ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_source: ${{ steps.plan.outputs.artifact_source }}
      external: ${{ steps.plan.outputs.external }}
      external_snapshot_artifact: ${{ steps.plan.outputs.external_snapshot_artifact }}
      image_release: ${{ steps.plan.outputs.image_release }}
      image_repository: ${{ steps.plan.outputs.image_repository }}
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
      upstream_image_repository: ${{ steps.plan.outputs.upstream_image_repository }}
      upstream_asset_sha256: ${{ steps.plan.outputs.upstream_asset_sha256 }}
      upstream_asset_url: ${{ steps.plan.outputs.upstream_asset_url }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx for image release validation
        if: inputs.service == 'studio'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read external release requirements
        id: external
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          python3 - "$SERVICE" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          with open(".github/service-release-sources.json", encoding="utf-8") as stream:
              entry = json.load(stream)["services"].get(sys.argv[1], {})
          descriptor = entry.get("external_release_descriptor", "")
          source_tag = "false"
          if descriptor:
              with open(descriptor, encoding="utf-8") as stream:
                  source_tag = str(json.load(stream)["github"]["artifact"]["type"] == "source-tag").lower()
          print(f"external={'true' if descriptor else 'false'}")
          print(f"source_tag={source_tag}")
          PY

      - name: Install pinned regctl for external release planning
        if: steps.external.outputs.external == 'true'
        shell: bash
        run: |
          set -euo pipefail
          regctl_version="v0.11.5"
          expected_sha256="c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467"
          curl -fsSL \
            "https://github.com/regclient/regclient/releases/download/${regctl_version}/regctl-linux-amd64" \
            -o "$RUNNER_TEMP/regctl"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/regctl" | cut -d' ' -f1)"
          [[ "$actual_sha256" == "$expected_sha256" ]] || {
            printf 'regctl checksum mismatch: expected %s, got %s\n' "$expected_sha256" "$actual_sha256" >&2
            exit 1
          }
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Nix for external source-tag planning
        if: steps.external.outputs.source_tag == 'true'
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Validate inputs and check existing release
        id: plan
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          case "$SERVICE" in
            auth|postgrest|realtime|pooler|analytics|storage|edge-runtime|studio|pgmeta|postgres|mailpit|vector|imgproxy) ;;
            *)
              printf 'unsupported release service: %s\n' "$SERVICE" >&2
              exit 1
              ;;
          esac

          config_line="$(python3 - "$SERVICE" <<'PY'
          import json
          import sys

          with open(".github/service-release-sources.json", encoding="utf-8") as fh:
              services = json.load(fh)["services"]

          service = sys.argv[1]
          config = services.get(service)
          if config is None:
              raise SystemExit(f"release policy not found for {service}")
          print(
              config["repository"],
              config["tag_pattern"],
              config.get("release_source", "github"),
              config.get("artifact_source", "source"),
              config.get("image_release", "derived"),
              config.get("image_repository", "-"),
              config.get("external_release_descriptor", "-"),
              config.get("source_ref_tag_pattern", "-"),
              sep="\t",
          )
          PY
          )"
          IFS=$'\t' read -r upstream_repository tag_pattern release_source artifact_source image_release upstream_image_repository external_descriptor source_ref_tag_pattern <<< "$config_line"

          if [[ "$external_descriptor" != "-" ]]; then
            snapshot_dir="$RUNNER_TEMP/external-release"
            mkdir -p "$snapshot_dir"
            snapshot="$snapshot_dir/snapshot.json"
            metadata="$(scripts/plan-external-release.sh "$SERVICE" "$VERSION" "$snapshot")"
            source_ref="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("source_commit", ""))' "$metadata")"
            release_tag="$SERVICE-$VERSION"
            image_repository="ghcr.io/$(
              printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]'
            )/cli/$SERVICE"
            publish=true
            if [[ "$FORCE" != "true" ]] && gh release view "$release_tag" >/dev/null 2>&1; then
              publish=false
              printf 'release %s already exists; skipping (use force=true to replace it)\n' "$release_tag"
            fi
            matrix='{"include":[{"target_os":"linux","arch":"arm64","platform_dir":"linux-arm64","runner":"large-linux-arm"},{"target_os":"linux","arch":"amd64","platform_dir":"linux-amd64","runner":"large-linux-x86"},{"target_os":"darwin","arch":"arm64","platform_dir":"darwin-arm64","runner":"macos-14-xlarge"}]}'
            {
              printf 'artifact_source=%s\n' "$artifact_source"
              printf 'external=true\n'
              printf 'external_snapshot_artifact=external-release-%s\n' "$GITHUB_RUN_ID"
              printf 'image_release=%s\n' "$image_release"
              printf 'image_repository=%s\n' "$image_repository"
              printf 'matrix=%s\n' "$matrix"
              printf 'publish=%s\n' "$publish"
              printf 'release_tag=%s\n' "$release_tag"
              printf 'source_ref=%s\n' "$source_ref"
              printf 'upstream_image_repository=%s\n' "$upstream_image_repository"
              printf 'upstream_asset_sha256=\n'
              printf 'upstream_asset_url=\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$artifact_source" in
            source|upstream-archive|external-source) ;;
            *)
              printf 'unsupported artifact source for %s: %s\n' "$SERVICE" "$artifact_source" >&2
              exit 1
              ;;
          esac
          case "$image_release" in
            derived|mirror) ;;
            *)
              printf 'unsupported image release mode for %s: %s\n' "$SERVICE" "$image_release" >&2
              exit 1
              ;;
          esac
          if [[ "$image_release" == "mirror" && ! "$upstream_image_repository" =~ ^[^/]+/[^/]+$ ]]; then
            printf 'mirror image release requires an upstream image repository for %s\n' "$SERVICE" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ $tag_pattern ]]; then
            printf 'version is not an allowed release tag for %s: %s (expected %s)\n' \
              "$SERVICE" "$VERSION" "$tag_pattern" >&2
            exit 1
          fi

          source_ref="$VERSION"
          upstream_release_tag="$VERSION"
          if [[ "$artifact_source" == "upstream-archive" ]]; then
            policy_file="$(
              bash -c '
                set -euo pipefail
                source scripts/lib.sh
                load_recipe "$1" >/dev/null
                printf "%s" "$UPSTREAM_ASSETS_FILE"
              ' _ "$SERVICE"
            )"
            [[ "$policy_file" = /* ]] || policy_file="$GITHUB_WORKSPACE/$policy_file"
            upstream_release_tag="$(
              python3 scripts/upstream-release.py release-tag \
                "$policy_file" "$VERSION"
            )"
          fi
          if [[ "$release_source" == "dockerhub" ]]; then
            dockerhub_resolver_args=(
              "$upstream_image_repository"
              "$VERSION"
              "$upstream_repository"
            )
            if [[ "$source_ref_tag_pattern" != "-" ]]; then
              dockerhub_resolver_args+=("$source_ref_tag_pattern")
            fi
            source_ref="$(
              scripts/resolve-dockerhub-release.sh \
                "${dockerhub_resolver_args[@]}"
            )"
          else
            if ! upstream_release="$(
              gh api "repos/$upstream_repository/releases/tags/$upstream_release_tag" \
                --jq '[.tag_name, (.draft | tostring), (.prerelease | tostring)] | @tsv'
            )"; then
              printf '%s is not a published upstream release of %s\n' \
                "$VERSION" "$upstream_repository" >&2
              exit 1
            fi
            IFS=$'\t' read -r upstream_tag upstream_draft upstream_prerelease \
              <<< "$upstream_release"
            if [[ "$upstream_tag" != "$upstream_release_tag" || "$upstream_draft" != "false" || "$upstream_prerelease" != "false" ]]; then
              printf '%s must be an exact, stable, published upstream release of %s\n' \
                "$upstream_release_tag" "$upstream_repository" >&2
              exit 1
            fi
          fi

          upstream_asset_url=""
          upstream_asset_sha256=""
          if [[ "$SERVICE" == "postgrest" ]]; then
            asset_name="postgrest-$VERSION-macos-aarch64.tar.xz"
            asset="$(
              gh api "repos/$upstream_repository/releases/tags/$VERSION" \
                --jq ".assets[] | select(.name == \"$asset_name\") | [.browser_download_url, .digest] | @tsv"
            )"
            [[ -n "$asset" ]] || {
              printf 'required upstream asset not found: %s\n' "$asset_name" >&2
              exit 1
            }
            IFS=$'\t' read -r upstream_asset_url upstream_asset_digest <<< "$asset"
            expected_asset_url="https://github.com/$upstream_repository/releases/download/$VERSION/$asset_name"
            [[ "$upstream_asset_url" == "$expected_asset_url" ]] || {
              printf 'unexpected upstream asset URL: %s\n' "$upstream_asset_url" >&2
              exit 1
            }
            [[ "$upstream_asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              printf 'upstream asset has no valid GitHub SHA-256 digest: %s\n' "$asset_name" >&2
              exit 1
            }
            upstream_asset_sha256="${upstream_asset_digest#sha256:}"
          fi

          release_tag="$SERVICE-$VERSION"
          image_repository="ghcr.io/$(
            printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]'
          )/cli/$SERVICE"
          publish=true
          if [[ "$FORCE" != "true" ]] && gh release view "$release_tag" >/dev/null 2>&1; then
            publish=false
            printf 'release %s already exists; skipping (use force=true to replace it)\n' "$release_tag"
          fi

          matrix='{"include":[{"target_os":"linux","arch":"arm64","platform_dir":"linux-arm64","runner":"large-linux-arm"},{"target_os":"linux","arch":"amd64","platform_dir":"linux-amd64","runner":"large-linux-x86"},{"target_os":"darwin","arch":"arm64","platform_dir":"darwin-arm64","runner":"macos-14-xlarge"}]}'
          {
            printf 'artifact_source=%s\n' "$artifact_source"
            printf 'external=false\n'
            printf 'external_snapshot_artifact=\n'
            printf 'image_release=%s\n' "$image_release"
            printf 'image_repository=%s\n' "$image_repository"
            printf 'matrix=%s\n' "$matrix"
            printf 'publish=%s\n' "$publish"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'source_ref=%s\n' "$source_ref"
            printf 'upstream_image_repository=%s\n' "$upstream_image_repository"
            printf 'upstream_asset_sha256=%s\n' "$upstream_asset_sha256"
            printf 'upstream_asset_url=%s\n' "$upstream_asset_url"
          } >> "$GITHUB_OUTPUT"

      - name: Upload external release snapshot
        if: steps.plan.outputs.external == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/external-release/

  build:
    name: ${{ inputs.service }} ${{ matrix.target_os }}/${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download planned external release snapshot
        if: needs.plan.outputs.external == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.external_snapshot_artifact }}
          path: external-release

      - name: Verify and export external release snapshot
        if: needs.plan.outputs.external == 'true'
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          snapshot="$GITHUB_WORKSPACE/external-release/snapshot.json"
          scripts/verify-external-release.sh "$snapshot" "$VERSION"
          printf 'UPSTREAM_ASSETS_FILE=%s\n' "$snapshot" >> "$GITHUB_ENV"

      - name: Checkout requested upstream release
        id: source
        if: needs.plan.outputs.artifact_source == 'source'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SERVICE: ${{ inputs.service }}
          SOURCE_REF: ${{ needs.plan.outputs.source_ref }}
          TARGET_OS: ${{ matrix.target_os }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          source_dir="$(bash -c '
            source scripts/lib.sh
            load_recipe "$SERVICE" >/dev/null
            printf "%s" "$SOURCE_DIR"
          ')"
          git submodule update --init --depth 1 "$source_dir"

          if ! git -C "$source_dir" rev-parse --verify --quiet "$SOURCE_REF^{commit}" >/dev/null; then
            if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              git -C "$source_dir" fetch --force --depth 1 origin "$SOURCE_REF"
            else
              git -C "$source_dir" fetch --force --depth 1 origin \
                "refs/tags/$SOURCE_REF:refs/tags/$SOURCE_REF"
            fi
          fi
          source_sha="$(git -C "$source_dir" rev-parse "$SOURCE_REF^{commit}")"
          git -C "$source_dir" checkout --detach "$source_sha"
          [[ -z "$(git -C "$source_dir" status --porcelain)" ]] || {
            printf 'source checkout is dirty: %s\n' "$source_dir" >&2
            exit 1
          }

          {
            printf 'source_dir=%s\n' "$source_dir"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: needs.plan.outputs.artifact_source == 'source' || (needs.plan.outputs.external == 'true' && needs.plan.outputs.artifact_source == 'external-source')
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Restore/save Nix store cache
        if: needs.plan.outputs.artifact_source == 'source' || (needs.plan.outputs.external == 'true' && needs.plan.outputs.artifact_source == 'external-source')
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: release-${{ inputs.service }}-${{ matrix.platform_dir }}-${{ hashFiles(format('services/{0}/recipe.env', inputs.service), format('services/{0}/nix/**', inputs.service), format('services/{0}/build-host.sh', inputs.service), 'scripts/nix-build-with-derived-mix-hash.sh', 'scripts/nixpkgs-pin.sh') }}
          restore-prefixes-first-match: |
            release-${{ inputs.service }}-${{ matrix.platform_dir }}-
          gc-max-store-size-linux: 8G
          gc-max-store-size-macos: 8G

      - name: Set up Docker Buildx
        if: matrix.target_os == 'linux' && needs.plan.outputs.image_release == 'derived' && (needs.plan.outputs.artifact_source == 'source' || (needs.plan.outputs.external == 'true' && needs.plan.outputs.artifact_source == 'external-source'))
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Go
        if: inputs.service == 'auth' && needs.plan.outputs.artifact_source == 'source'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sources/auth/go.mod
          cache-dependency-path: sources/auth/go.sum

      - name: Build, audit, smoke, and package
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_TAG: local/${{ inputs.service }}:${{ inputs.version }}-${{ matrix.platform_dir }}
          OCI_REVISION: ${{ github.sha }}
          OCI_SOURCE: https://github.com/${{ github.repository }}
          OCI_VERSION: ${{ inputs.version }}
          SLIM_SMOKE_HOST_POSTGRES: ${{ matrix.target_os == 'darwin' && '1' || '0' }}
          SOURCE_REF: ${{ needs.plan.outputs.source_ref }}
          STUDIO_RELEASE: ${{ inputs.version }}
          TARGET_OS: ${{ matrix.target_os }}
          UPSTREAM_ASSET_SHA256: ${{ needs.plan.outputs.upstream_asset_sha256 }}
          UPSTREAM_ASSET_URL: ${{ needs.plan.outputs.upstream_asset_url }}
        run: |
          set -euo pipefail
          scripts/ci-build-service.sh "${{ inputs.service }}" "${{ inputs.version }}"

      - name: Smoke artifact as a host process
        if: matrix.target_os == 'linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SLIM_DIRECT_LINUX_ARTIFACT_SMOKE: "1"
          SOURCE_REF: ${{ needs.plan.outputs.source_ref }}
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          set -euo pipefail
          scripts/smoke.sh "${{ inputs.service }}" \
            --artifact "artifacts/${{ inputs.service }}/${{ inputs.version }}/${{ matrix.platform_dir }}/rootfs"

      - name: Stage release assets
        id: stage
        shell: bash
        env:
          PLATFORM_DIR: ${{ matrix.platform_dir }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="artifacts/$SERVICE/$VERSION/$PLATFORM_DIR"
          release_dir="release-assets"
          mkdir -p "$release_dir"

          archive="$(find "$artifact_dir" -maxdepth 1 -type f \( -name '*.tar.zst' -o -name '*.tar.gz' -o -name '*.tar' \) -print -quit)"
          [[ -n "$archive" ]] || {
            printf 'distribution archive not found in %s\n' "$artifact_dir" >&2
            exit 1
          }
          cp "$archive" "$release_dir/"
          cp "$artifact_dir/manifest.json" \
            "$release_dir/$SERVICE-$VERSION-$PLATFORM_DIR.manifest.json"
          cp "$artifact_dir/$SERVICE-$VERSION-$PLATFORM_DIR.sbom.spdx.json" \
            "$release_dir/"
          cp "$artifact_dir/SHA256SUMS" \
            "$release_dir/$SERVICE-$VERSION-$PLATFORM_DIR.SHA256SUMS"

      - name: Save exact smoked image for publication
        if: matrix.target_os == 'linux' && needs.plan.outputs.image_release == 'derived'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          LOCAL_IMAGE: local/${{ inputs.service }}:${{ inputs.version }}-${{ matrix.platform_dir }}
          PLATFORM: linux/${{ matrix.arch }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-image
          image_archive="$SERVICE-$VERSION-linux-$ARCH.image.tar.gz"
          docker image inspect "$LOCAL_IMAGE" >/dev/null
          docker save "$LOCAL_IMAGE" | gzip -1 > "release-image/$image_archive"
          python3 - "$LOCAL_IMAGE" "$PLATFORM" "$image_archive" \
            "release-image/$SERVICE-$VERSION-linux-$ARCH.image.json" <<'PY'
          import json
          import sys

          local_image, platform, archive, output = sys.argv[1:]
          with open(output, "w", encoding="utf-8") as fh:
              json.dump({
                  "archive": archive,
                  "local_image": local_image,
                  "platform": platform,
              }, fh, indent=2)
              fh.write("\n")
          PY

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ inputs.service }}-${{ inputs.version }}-${{ matrix.platform_dir }}
          if-no-files-found: error
          retention-days: 7
          path: release-assets/

      - name: Upload exact smoked image
        if: matrix.target_os == 'linux' && needs.plan.outputs.image_release == 'derived'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ inputs.service }}-${{ inputs.version }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: release-image/

  publish-image:
    name: publish ${{ inputs.service }} multi-platform image
    needs:
      - plan
      - build
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download exact smoked images
        if: needs.plan.outputs.image_release == 'derived'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-${{ inputs.service }}-${{ inputs.version }}-*
          path: release-images
          merge-multiple: true

      - name: Set up Docker Buildx
        if: needs.plan.outputs.image_release == 'derived'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Checkout mirror helper
        if: needs.plan.outputs.image_release == 'mirror'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download planned external release snapshot for mirror
        if: needs.plan.outputs.external == 'true' && needs.plan.outputs.image_release == 'mirror'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.external_snapshot_artifact }}
          path: external-release

      - name: Verify and export external release snapshot for mirror
        if: needs.plan.outputs.external == 'true' && needs.plan.outputs.image_release == 'mirror'
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          snapshot="$GITHUB_WORKSPACE/external-release/snapshot.json"
          scripts/verify-external-release.sh "$snapshot" "$VERSION"
          printf 'UPSTREAM_ASSETS_FILE=%s\n' "$snapshot" >> "$GITHUB_ENV"

      - name: Install regctl
        if: needs.plan.outputs.image_release == 'mirror'
        shell: bash
        run: |
          set -euo pipefail
          regctl_version="v0.11.5"
          expected_sha256="c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467"
          curl -fsSL \
            "https://github.com/regclient/regclient/releases/download/${regctl_version}/regctl-linux-amd64" \
            -o "$RUNNER_TEMP/regctl"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/regctl" | cut -d' ' -f1)"
          [[ "$actual_sha256" == "$expected_sha256" ]] || {
            printf 'regctl checksum mismatch: expected %s, got %s\n' \
              "$expected_sha256" "$actual_sha256" >&2
            exit 1
          }
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push platform images and publish manifest
        id: publish
        if: needs.plan.outputs.image_release == 'derived'
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          refs=()

          while IFS= read -r metadata_file; do
            metadata="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$metadata_file")"
            archive="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["archive"])' "$metadata")"
            local_image="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["local_image"])' "$metadata")"
            platform="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["platform"])' "$metadata")"
            platform_tag="${IMAGE_REPOSITORY}:${VERSION}-${platform//\//-}"

            gzip -dc "$(dirname "$metadata_file")/$archive" | docker load
            docker tag "$local_image" "$platform_tag"
            docker push "$platform_tag"

            digest="$(docker buildx imagetools inspect "$platform_tag" | awk '$1 == "Digest:" { print $2 }')"
            [[ "$digest" == sha256:* ]] || {
              printf 'could not resolve digest for %s\n' "$platform_tag" >&2
              exit 1
            }
            refs+=("$IMAGE_REPOSITORY@$digest")
          done < <(find release-images -name '*.image.json' -type f | sort)

          if [[ "${#refs[@]}" -ne 2 ]]; then
            printf 'expected two platform images, got %s\n' "${#refs[@]}" >&2
            exit 1
          fi

          image_tag="$IMAGE_REPOSITORY:$VERSION"
          docker buildx imagetools create -t "$image_tag" "${refs[@]}"
          docker buildx imagetools inspect "$image_tag"
          digest="$(docker buildx imagetools inspect "$image_tag" | awk '$1 == "Digest:" { print $2 }')"
          [[ "$digest" == sha256:* ]] || {
            printf 'could not resolve digest for %s\n' "$image_tag" >&2
            exit 1
          }

          {
            printf 'digest=%s\n' "$digest"
            printf 'image_tag=%s\n' "$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Mirror upstream OCI image
        id: mirror
        if: needs.plan.outputs.image_release == 'mirror'
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/mirror-upstream-image.sh \
            "$SERVICE" "$VERSION" "$IMAGE_REPOSITORY" mirror-provenance.json
          digest="$(python3 -c 'import json; print(json.load(open("mirror-provenance.json"))["destination_index_digest"])')"
          image_tag="$IMAGE_REPOSITORY:$VERSION"
          {
            printf 'digest=%s\n' "$digest"
            printf 'image_tag=%s\n' "$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Record published derived image
        if: needs.plan.outputs.image_release == 'derived'
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAG: ${{ steps.publish.outputs.image_tag }}
        run: |
          python3 - "$IMAGE_TAG" "$DIGEST" <<'PY'
          import json
          import sys

          with open("published-image.json", "w", encoding="utf-8") as fh:
              json.dump({"image": sys.argv[1], "digest": sys.argv[2]}, fh, indent=2)
              fh.write("\n")
          PY

      - name: Record published mirrored image
        if: needs.plan.outputs.image_release == 'mirror'
        shell: bash
        env:
          DIGEST: ${{ steps.mirror.outputs.digest }}
          IMAGE_TAG: ${{ steps.mirror.outputs.image_tag }}
        run: |
          python3 - "$IMAGE_TAG" "$DIGEST" <<'PY'
          import json
          import sys

          with open("published-image.json", "w", encoding="utf-8") as fh:
              json.dump({
                  "image": sys.argv[1],
                  "digest": sys.argv[2],
                  "image_release": "mirror",
                  "provenance": "mirror-provenance.json",
              }, fh, indent=2)
              fh.write("\n")
          PY

      - name: Upload published image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-${{ inputs.service }}-${{ inputs.version }}
          retention-days: 7
          path: published-image.json

      - name: Upload OCI mirror provenance
        if: needs.plan.outputs.image_release == 'mirror'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirror-provenance-${{ inputs.service }}-${{ inputs.version }}
          retention-days: 7
          path: mirror-provenance.json

  mirror-ecr:
    name: mirror ${{ inputs.service }} image to ECR Public
    needs:
      - plan
      - publish-image
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      mirrored: ${{ steps.mirror.outputs.mirrored || 'false' }}
    steps:
      - name: Checkout mirror scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check mirror dispatch configuration
        id: config
        shell: bash
        env:
          MIRROR_DISPATCH_TOKEN: ${{ secrets.CLI_MIRROR_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MIRROR_DISPATCH_TOKEN" ]]; then
            echo "::notice::CLI_MIRROR_DISPATCH_TOKEN is not configured; skipping the ECR Public mirror"
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Download published image metadata
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-image-${{ inputs.service }}-${{ inputs.version }}

      - name: Install regctl
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          regctl_version="v0.11.5"
          expected_sha256="c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467"
          curl -fsSL \
            "https://github.com/regclient/regclient/releases/download/${regctl_version}/regctl-linux-amd64" \
            -o "$RUNNER_TEMP/regctl"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/regctl" | cut -d' ' -f1)"
          [[ "$actual_sha256" == "$expected_sha256" ]] || {
            printf 'regctl checksum mismatch: expected %s, got %s\n' \
              "$expected_sha256" "$actual_sha256" >&2
            exit 1
          }
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Request and verify ECR Public mirror
        id: mirror
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          MIRROR_DISPATCH_TOKEN: ${{ secrets.CLI_MIRROR_DISPATCH_TOKEN }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json; print(json.load(open("published-image.json"))["digest"])')"
          scripts/ecr-mirror.sh request "$SERVICE" "$VERSION" "$digest"
          printf 'mirrored=true\n' >> "$GITHUB_OUTPUT"

  publish-release:
    name: publish ${{ inputs.service }} release
    needs:
      - plan
      - build
      - publish-image
      - mirror-ecr
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download portable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-${{ inputs.service }}-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Download published image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-image-${{ inputs.service }}-${{ inputs.version }}

      - name: Download OCI mirror provenance
        if: needs.plan.outputs.image_release == 'mirror'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirror-provenance-${{ inputs.service }}-${{ inputs.version }}
          path: mirror-provenance

      - name: Download and verify planned external release snapshot
        if: needs.plan.outputs.external == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.external_snapshot_artifact }}
          path: external-release

      - name: Preserve external release snapshot evidence
        if: needs.plan.outputs.external == 'true'
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          snapshot="$GITHUB_WORKSPACE/external-release/snapshot.json"
          scripts/verify-external-release.sh "$snapshot" "$VERSION"
          cp "$snapshot" "release-assets/$SERVICE-$VERSION.external-release.json"
          cp "$snapshot.sha256" "release-assets/$SERVICE-$VERSION.external-release.json.sha256"

      - name: Prepare checksums and release notes
        shell: bash
        env:
          IMAGE_RELEASE: ${{ needs.plan.outputs.image_release }}
          MIRRORED: ${{ needs.mirror-ecr.outputs.mirrored }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_RELEASE" == "mirror" ]]; then
            provenance="mirror-provenance/mirror-provenance.json"
            [[ -f "$provenance" ]] || {
              printf 'OCI mirror provenance not found: %s\n' "$provenance" >&2
              exit 1
            }
            cp "$provenance" "release-assets/$SERVICE-$VERSION.oci-provenance.json"
          fi

          {
            find release-assets -name '*.SHA256SUMS' -type f -print0 \
              | sort -z \
              | xargs -0 cat
            for evidence in \
              "release-assets/$SERVICE-$VERSION.external-release.json" \
              "release-assets/$SERVICE-$VERSION.external-release.json.sha256" \
              "release-assets/$SERVICE-$VERSION.oci-provenance.json"; do
              [[ -f "$evidence" ]] || continue
              python3 - "$evidence" "${evidence#release-assets/}" <<'PY'
          import hashlib
          import pathlib
          import sys

          path, relative_path = map(pathlib.Path, sys.argv[1:])
          print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative_path}")
          PY
            done
          } | sort -k2 > release-assets/SHA256SUMS
          find release-assets -name '*.SHA256SUMS' -type f \
            ! -path 'release-assets/SHA256SUMS' -delete

          image="$(python3 -c 'import json; print(json.load(open("published-image.json"))["image"])')"
          digest="$(python3 -c 'import json; print(json.load(open("published-image.json"))["digest"])')"
          cat > release-notes.md <<EOF
          Portable, smoke-tested runtime artifacts for **$SERVICE $VERSION**.

          Targets:

          - linux/amd64
          - linux/arm64
          - darwin/arm64

          Multi-platform Docker image:

          \`$image\`

          Immutable image reference:

          \`$image@$digest\`

          Verify a downloaded archive with the attached \`SHA256SUMS\` file.
          EOF

          if [[ "${MIRRORED:-}" == "true" ]]; then
            ecr_image="$(
              scripts/ecr-mirror.sh payload "$SERVICE" "$VERSION" "$digest" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["client_payload"]["destination"])'
            )"
            ecr_image="${ecr_image%%:*}"
            cat >> release-notes.md <<EOF

          AWS ECR Public mirror (same digests):

          \`$ecr_image:$VERSION\`

          \`$ecr_image@$digest\`
          EOF
          fi

          if [[ "$IMAGE_RELEASE" == "mirror" ]]; then
            python3 - "release-assets/$SERVICE-$VERSION.oci-provenance.json" "$image" >> release-notes.md <<'PY'
          import json
          import sys

          provenance_path, destination_image = sys.argv[1:]
          with open(provenance_path, encoding="utf-8") as stream:
              provenance = json.load(stream)
          print()
          print("Exact OCI mirror provenance:")
          print(f"- Provenance asset: `{provenance_path.rsplit('/', 1)[-1]}`")
          print(f"- Upstream immutable reference: `{provenance['source_ref']}`")
          print(f"- Upstream index digest: `{provenance['pinned_index_digest']}`")
          print(f"- Destination immutable reference: `{destination_image}@{provenance['destination_index_digest']}`")
          for platform, digest in sorted(provenance["platforms"].items()):
              print(f"- {platform} immutable reference: `{destination_image}@{digest}`")
          for digest in provenance.get("embedded_attestations", []):
              print(f"- Embedded attestation descriptor: `{digest}`")
          PY
          fi

      - name: Create or update GitHub release
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$FORCE" == "true" ]] || {
              printf 'release appeared while this run was building: %s\n' "$RELEASE_TAG" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$SERVICE $VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$SERVICE $VERSION" \
              --notes-file release-notes.md
          fi
