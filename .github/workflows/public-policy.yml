name: Public policy

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: public policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require immutable action references
        run: scripts/check-actions-pinned.sh

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts services -type f -name '*.sh' -print | sort)

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts services -type f -name '*.sh' -print | sort)
          shellcheck --severity=warning "${scripts[@]}"
