name: Poll upstream service releases

"on":
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      service:
        description: Optional enabled service to poll; empty polls all enabled services.
        required: false
        type: string
        default: ""
      dry_run:
        description: Report releases without dispatching builds.
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: poll-upstream-service-releases
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Poll latest matching stable releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLL_SERVICE: ${{ inputs.service }}
          POLL_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: scripts/poll-service-releases.sh
