name: Host-native darwin artifacts

# Builds, smokes, and uploads the darwin-arm64 host-native archives for every
# service promoted to the host-native contract (HOST_NATIVE_PLAN.md).
# Edge Runtime keeps its own workflow (edge-runtime-artifacts.yml), which
# already covers darwin.
#
# macOS runners have no Docker; smokes run with SLIM_SMOKE_HOST_POSTGRES=1 so
# the harness postgres runs as a host process from the pinned nixpkgs.

"on":
  workflow_dispatch:
    inputs:
      services:
        description: Space-separated services to build (default = all promoted).
        required: false
        default: auth postgrest realtime pooler analytics storage pgmeta

permissions:
  contents: read

jobs:
  plan:
    name: expand service matrix
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.expand.outputs.services }}
    steps:
      - name: Expand requested services
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          services_json="$(printf '%s' "${{ inputs.services }}" | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          printf 'services=%s\n' "$services_json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.service }} darwin/arm64
    needs: plan
    runs-on: macos-14
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout service source
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 "sources/${{ matrix.service }}"

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Restore/save Nix store cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-host-native-${{ matrix.service }}-${{ hashFiles(format('services/{0}/recipe.env', matrix.service), format('services/{0}/nix/**', matrix.service), format('services/{0}/build-host.sh', matrix.service), 'scripts/nixpkgs-pin.sh') }}
          restore-prefixes-first-match: |
            nix-host-native-${{ matrix.service }}-
          gc-max-store-size-macos: 8G

      - name: Set up Go
        if: matrix.service == 'auth'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Prepare target variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          version="$(TARGET_OS=darwin ARCH=arm64 bash -c '
            source scripts/lib.sh
            load_recipe "${{ matrix.service }}" >/dev/null 2>&1
            printf "%s" "$SOURCE_REF"
          ')"
          artifact_dir="artifacts/${{ matrix.service }}/${version}/darwin-arm64"
          {
            printf 'version=%s\n' "$version"
            printf 'artifact_dir=%s\n' "$artifact_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Build, audit, smoke, and package
        shell: bash
        env:
          TARGET_OS: darwin
          ARCH: arm64
          SLIM_SMOKE_HOST_POSTGRES: "1"
        run: |
          set -euo pipefail
          scripts/ci-build-service.sh "${{ matrix.service }}" "${{ steps.vars.outputs.version }}"

      - name: Upload portable archive + checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-${{ steps.vars.outputs.version }}-darwin-arm64
          if-no-files-found: error
          path: |
            ${{ steps.vars.outputs.artifact_dir }}/*.tar.zst
            ${{ steps.vars.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.vars.outputs.artifact_dir }}/manifest.json
