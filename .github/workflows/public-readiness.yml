name: Public readiness

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: public readiness code gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output "$archive"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $archive" \
            | sha256sum --check
          tar -xzf "$archive" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Run public-readiness code gate
        run: scripts/verify-public-readiness.sh --phase code
