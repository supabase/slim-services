name: Refresh published release results

"on":
  workflow_run:
    workflows:
      - Release service artifacts and image
    types:
      - completed
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-published-release-results
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh README release tables
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RESULTS_ARTIFACTS_DIR: ${{ github.workspace }}/release-results-artifacts
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Download latest published manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-latest-release-manifests.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Regenerate published tables
        run: scripts/update-results-tables.sh --merge --published

      - name: Commit, open, and merge docs pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "published tables are current"
            exit 0
          fi

          branch="gha/refresh-release-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md
          git commit -m "docs: refresh published release results"
          git push origin "$branch"

          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "docs: refresh published release results" \
            --body "Automated reconciliation of the README tables from the latest published service release manifests. Generated by the [release-results workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).")"
          gh pr merge "$pr_url" --squash --delete-branch
